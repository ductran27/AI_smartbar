name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # Repo floor is 3.9 (see README.md "Layout" section and
      # smartbar/core/popover_layout.py). We pin one version above that
      # floor rather than a floor-to-ceiling matrix: the suite is plain
      # stdlib unittest with no version-conditional code paths, so testing
      # N Pythons buys nothing but CI minutes.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Linux/macOS build pycairo from its sdist and therefore need cairo's
      # headers plus pkg-config. Windows receives PyPI's cp312 win_amd64
      # wheel and needs no system SDK. Keep GTK/PyGObject absent: the portable
      # painter deliberately has no GTK dependency, while importing cairo is
      # mandatory below so painter tests cannot quietly turn into skips.
      - name: Install Cairo build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install Cairo build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pkg-config

      - name: Install pinned pycairo
        run: python -m pip install --disable-pip-version-check pycairo==1.29.0

      - name: Verify Cairo is importable
        run: python -c "import cairo; print(cairo.cairo_version_string())"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # Unit assertions inspect every generated command, but this Linux-only
      # lifecycle also executes the fixed root shell plan on the runner. It
      # catches distro path/stat differences and proves ownership, modes,
      # idempotence, tamper refusal, and exact removal before a release tag can
      # be published.
      - name: Exercise privileged Linux fallback guard lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          sudo env AI_SMARTBAR_RUN_ROOT_TESTS=1 "$PYTHON_BIN" -m unittest \
            tests.test_fallback_guard.TestLinuxRootIntegration.test_linux_root_scripts_are_idempotent_and_tamper_safe \
            -v

      # `swift test` compiles the front-end and exercises its decoding/state
      # policy. A build-only gate previously let Swift regressions through.
      - name: Test the Swift front-end
        if: runner.os == 'macOS'
        run: swift test -c release --package-path macos-swift
