name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # Repo floor is 3.9 (see README.md "Layout" section and
      # smartbar/core/popover_layout.py). We pin one version above that
      # floor rather than a floor-to-ceiling matrix: the suite is plain
      # stdlib unittest with no version-conditional code paths, so testing
      # N Pythons buys nothing but CI minutes.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Linux/macOS build pycairo from its sdist and therefore need cairo's
      # headers plus pkg-config. Windows receives PyPI's cp312 win_amd64
      # wheel and needs no system SDK. Keep GTK/PyGObject absent: the portable
      # painter deliberately has no GTK dependency, while importing cairo is
      # mandatory below so painter tests cannot quietly turn into skips.
      - name: Install Cairo build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install Cairo build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pkg-config

      - name: Install pinned pycairo
        run: python -m pip install --disable-pip-version-check pycairo==1.29.0

      - name: Verify Cairo is importable
        run: python -c "import cairo; print(cairo.cairo_version_string())"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # ruff check (not "ruff format --check"): nearly every file in this
      # repo is DELIBERATELY hand-formatted -- aligned "# --- name ---"
      # section markers, hand-wrapped comment blocks that read as prose,
      # continuation lines lined up under the open paren by eye rather than
      # by the formatter's rules. Turning the formatter loose here would be
      # a ~5800-line cosmetic rewrite on every one of those files that
      # destroys structure a reviewer put there on purpose, for a gain
      # (consistent auto-formatting) this repo has explicitly opted out of.
      # `ruff check` catches the things that were never a style choice --
      # unused imports, unused locals, genuine defects -- without touching
      # any of that layout, so it is the one half of "ruff" this job runs.
      #
      # One leg only: unlike the unittest step above, ruff check is pure
      # static analysis over the checked-out source tree -- it never
      # executes any of this repo's OS-conditional code paths (win32
      # branches, gi/GTK on Linux, etc.), so its result cannot vary by
      # runner OS. Running it on all three would just be the same verdict
      # three times for three times the CI minutes. ubuntu-latest is
      # picked as the one leg because it is the cheapest GitHub-hosted
      # runner and needs no extra setup for this step.
      - name: Install ruff
        if: matrix.os == 'ubuntu-latest'
        run: pip install ruff==0.15.16

      - name: Lint (ruff check)
        if: matrix.os == 'ubuntu-latest'
        run: ruff check .

      # Compile the Swift front-end so a macOS-breaking change cannot land
      # green. There is no Swift test target: the state policy Swift mirrors
      # is pinned from the Python side by the source-scraping parity tests.
      - name: Build the Swift front-end
        if: runner.os == 'macOS'
        run: swift build -c release --package-path macos-swift
