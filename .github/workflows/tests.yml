name: tests

# push is narrowed to main: with an unfiltered `push` alongside `pull_request`,
# every push to a branch with an open PR ran the whole 3-OS matrix TWICE for
# one change. main still gets its own push run, which is what
# install/release.sh's tag gate looks for (`--event push --branch main
# --commit <sha>`), so narrowing this costs the release flow nothing.
on:
  push:
    branches: [main]
  pull_request:
  # Manual escape hatch: Actions → tests → "Run workflow" against any branch
  # runs EVERY leg — Windows and the Swift build included — without waiting for
  # a merge. Dispatch has no "before" SHA, so it lands in the fail-safe arm of
  # the `changes` job below and gets the lot. Use it on a PR branch that
  # touches macos-swift/ or the win32 paths when you want the cross-OS verdict
  # before merging.
  workflow_dispatch:

# A new push makes the run already in flight obsolete, so stop paying for it.
# main is deliberately EXEMPT: install/release.sh refuses to tag unless the
# tests run for that exact SHA concluded `success`, and a cancelled run is not
# success — cancelling on main would turn every closely-spaced push into a
# blocked release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The arithmetic the whole file is shaped around: Actions minutes are
# multiplied by runner — Linux 1x, Windows 2x, macOS 10x — and every job
# rounds UP to a whole minute. A job's duration is therefore almost irrelevant;
# `swift build` finishes in 25 seconds and still bills ten minutes. Nothing
# here is fixed by making jobs faster. The only lever any of it responds to is
# running the expensive runners LESS OFTEN, and there are three independent
# places to pull it:
#
#   - PR runs get the ubuntu leg and nothing else. No Windows, no macOS.
#   - push runs on main reach macOS only when `macos-swift/` genuinely
#     changed, and Windows only on the commits that can become a release.
#     Both verdicts come from the `changes` job.
#
# None of the three subsumes the others: PR runs and push runs are separate
# populations (18 and 39 respectively in Aug 2026), and within push runs the
# macOS and Windows gates fire on different commits — measured over the last
# 25 pushes to main, 17 touch macos-swift/ while only the handful that
# install/release.sh authored touch Version.swift.
jobs:
  # Which expensive runners this change can possibly break, decided once on a
  # cheap one so the jobs below can be skipped OUTRIGHT rather than started and
  # short-circuited. That distinction is the entire point: GitHub bills a job
  # that starts and immediately skips its steps exactly like one that does the
  # work, so an `if:` on the steps would save nothing. One Linux minute to skip
  # ten macOS ones and two Windows ones.
  #
  # Not on pull_request: PRs run neither of the gated legs (see their own
  # comments below), so there would be nothing for these verdicts to gate.
  changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The diff below needs both endpoints present, and a shallow clone
          # has neither for anything but the newest commit.
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Fails SAFE, in every direction: a missing base, the all-zero SHA
          # git reports for a branch's first push, a base this clone does not
          # have, or a manual dispatch (which has no "before" at all and is
          # asked for precisely when someone wants the full verdict) all
          # answer "run everything". Skipping a leg wrongly lets a broken
          # front-end or a broken Windows path reach a tag; running one
          # wrongly costs minutes. Those are not the same size of mistake, so
          # every case this cannot decide resolves toward coverage.
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
            echo "windows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three-dot: compare against the MERGE BASE, so a merge commit is
          # judged on what it brought in rather than on everything main
          # gained underneath the branch while it sat open.
          CHANGED="$(git diff --name-only "${BASE}...${GITHUB_SHA}")"

          if grep -q '^macos-swift/' <<<"$CHANGED"; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

          # Version.swift is the release commit's fingerprint — see the
          # `windows` job's comment for why that is the commit Windows runs on.
          if grep -qx 'macos-swift/Sources/AISmartbar/Version.swift' \
               <<<"$CHANGED"; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

  # The always-on leg, on every event, and the only one most changes ever
  # reach. It is a plain job rather than a 1-entry matrix because the other
  # OSes are no longer siblings of it — they are separately gated jobs below,
  # which is also what lets the ruff and apt steps here drop the
  # `if: matrix.os == ...` guards they used to carry.
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Repo floor is 3.9 (see README.md "Layout" section and
      # smartbar/core/popover_layout.py). We pin one version above that
      # floor rather than a floor-to-ceiling matrix: the suite is plain
      # stdlib unittest with no version-conditional code paths, so testing
      # N Pythons buys nothing but CI minutes.
      #
      # There is deliberately no 3.9 LEG, and it is not an oversight: GitHub's
      # ubuntu-24.04 runners cache 3.10 upward, and the pinned pycairo below
      # is itself 3.10+, so a 3.9 job would be a bespoke interpreter build
      # plus a second pycairo pin to maintain forever. What the floor actually
      # needs protecting from is one specific mistake — `x: str | None`, valid
      # syntax that raises TypeError at import on 3.9 — and ruff's FA102 rule
      # (enabled in pyproject.toml, under `target-version = "py39"`) catches
      # exactly that, statically, on every run. See that file's own comment.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Linux builds pycairo from its sdist and therefore needs cairo's
      # headers plus pkg-config. Keep GTK/PyGObject absent: the portable
      # painter deliberately has no GTK dependency, while importing cairo is
      # mandatory below so painter tests cannot quietly turn into skips.
      - name: Install Cairo build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install pinned pycairo
        run: python -m pip install --disable-pip-version-check pycairo==1.29.0

      - name: Verify Cairo is importable
        run: python -c "import cairo; print(cairo.cairo_version_string())"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # ruff check (not "ruff format --check"): nearly every file in this
      # repo is DELIBERATELY hand-formatted -- aligned "# --- name ---"
      # section markers, hand-wrapped comment blocks that read as prose,
      # continuation lines lined up under the open paren by eye rather than
      # by the formatter's rules. Turning the formatter loose here would be
      # a ~5800-line cosmetic rewrite on every one of those files that
      # destroys structure a reviewer put there on purpose, for a gain
      # (consistent auto-formatting) this repo has explicitly opted out of.
      # `ruff check` catches the things that were never a style choice --
      # unused imports, unused locals, genuine defects -- without touching
      # any of that layout, so it is the one half of "ruff" this job runs.
      #
      # Here and nowhere else: ruff check is pure static analysis over the
      # checked-out source tree -- it never executes any of this repo's
      # OS-conditional code paths (win32 branches, gi/GTK on Linux, etc.), so
      # its result cannot vary by runner OS. Running it on another leg would
      # just be the same verdict twice for twice the CI minutes.
      - name: Install ruff
        run: pip install ruff==0.15.16

      - name: Lint (ruff check)
        run: ruff check .

  # Run the suite on a real Windows box, on the commits where a Windows break
  # could actually cost something.
  #
  # This leg does not enable a single test. It DISABLES three — the
  # `skipIf sys.platform == "win32"` guards in tests/test_update_rollback.py
  # and tests/test_warmup_runner.py — because every win32 branch this repo has
  # is already exercised on Linux by FAKING sys.platform (a dozen sites across
  # tests/test_runner_portability.py, test_presence.py and test_notify_windows.py;
  # smartbar/core/portable.py and smartbar/update_runner.py both say so in
  # their own comments). So in terms of test bodies executed, Windows runs a
  # strict SUBSET of the ubuntu leg above.
  #
  # What it does uniquely prove is environmental rather than logical: that real
  # Windows path semantics do not upset the tests that were never win32-gated,
  # and that PyPI's cp312 win_amd64 pycairo wheel installs and imports. Both
  # are worth knowing before a release and worth very little between them —
  # which is exactly the shape of a gate rather than a per-push leg.
  #
  # So: the release commit, and only the release commit. install/release.sh
  # writes one whose ONLY two files are Version.swift and smartbar/__init__.py
  # (it pins that shape itself, as EXPECTED_CANDIDATE_FILES), pushes it to
  # main, and refuses to tag until that exact SHA's push run concludes
  # `success`. Gating on Version.swift therefore lands this job precisely on
  # the commits that become releases, where a Windows failure blocks the tag —
  # the only outcome it was ever in a position to block. Ordinary pushes in
  # between skip it, and a skipped job still concludes the run `success`, so
  # the gate keeps working untouched. When you want the verdict sooner, the
  # workflow_dispatch escape hatch at the top of this file runs it on demand.
  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No apt step: Windows receives PyPI's cp312 win_amd64 wheel and needs
      # no system cairo SDK. The import check below is the point of the leg,
      # not boilerplate — it is what proves that wheel is still shipping.
      - name: Install pinned pycairo
        run: python -m pip install --disable-pip-version-check pycairo==1.29.0

      - name: Verify Cairo is importable
        run: python -c "import cairo; print(cairo.cairo_version_string())"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  # Compile the Swift front-end so a macOS-breaking change cannot land green.
  # There is no Swift test target: the state policy Swift mirrors is pinned
  # from the Python side by the source-scraping parity tests, which run on the
  # ubuntu leg above and therefore on every single run — a colour or geometry
  # number drifting between the two languages fails there, on Linux, without
  # this job.
  #
  # Which is what makes skipping this one safe when macos-swift/ is untouched:
  # a change that leaves the Swift sources byte-identical cannot alter whether
  # they compile, and the one class of Python-side change that CAN invalidate
  # them — drifting away from what the Swift declares — is caught by those
  # parity tests instead.
  #
  # The release gate keeps working for free. install/release.sh bumps
  # macos-swift/Sources/AISmartbar/Version.swift as part of the release commit
  # itself, so every commit that ever gets tagged touches macos-swift/ by
  # construction and therefore always arrives here — verified against all six
  # release commits in this repo's history. A skipped job still concludes the
  # run `success`, so the ordinary main pushes in between cost nothing and
  # still satisfy the gate.
  #
  # No Python on this leg: it does not run the suite, so it needs neither
  # cairo nor an interpreter, which is most of what used to keep this job
  # hovering either side of the 60-second line that decides whether macOS
  # bills ten minutes or twenty.
  swift:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build the Swift front-end
        run: swift build -c release --package-path macos-swift

  # The e2e suites used to run ONLY from install/release.sh, on whichever
  # machine cut the release. That made the tag gate weaker than the release
  # script it gates: CI would go green on a change that broke the installers,
  # and only the maintainer's own laptop would ever find out.
  #
  # ubuntu is the right (and only needed) leg. Both scripts branch on
  # `uname`, and their macOS arms are the ones a release cut on a Mac already
  # covers — so running them here exercises the LINUX arms that otherwise
  # never run anywhere. Both are hermetic by construction: e2e-config shadows
  # launchctl/systemctl/crontab/pkill/setsid/nohup with no-op stubs and points
  # HOME at a temporary directory, and e2e-update builds a throwaway origin
  # and sets SMARTBAR_UPDATE_TARGETS so it can never reach a real install.
  #
  # These two and not the other three: e2e-config writes the units every
  # device re-installs on update (a malformed one is not a degraded feature,
  # it is a device that stops running the app) and e2e-update drives the
  # rollback path that protects devices nobody can test by hand. e2e-warmup,
  # e2e-autoadd and e2e-presence need stateful mocks or a real bare remote,
  # and stay where they are, behind release.sh's --full.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No pycairo: neither script renders anything. They drive the
      # installers and the update state machine, which are cairo-free.
      - name: config.env reaches the real agents
        run: ./tests/e2e-config.sh

      - name: self-update applies, blocks and rolls back
        run: ./tests/e2e-update.sh
