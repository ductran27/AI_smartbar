name: tests

# push is narrowed to main: with an unfiltered `push` alongside `pull_request`,
# every push to a branch with an open PR ran the whole 3-OS matrix TWICE for
# one change. main still gets its own push run, which is what
# install/release.sh's tag gate looks for (`--event push --branch main
# --commit <sha>`), so narrowing this costs the release flow nothing.
on:
  push:
    branches: [main]
  pull_request:
  # Manual escape hatch: Actions → tests → "Run workflow" against any branch
  # runs the FULL matrix (see the strategy comment below) without waiting for
  # a merge — use it on a PR branch that touches macos-swift/ or win32 paths
  # when you want the cross-OS verdict before merging.
  workflow_dispatch:

# A new push makes the run already in flight obsolete, so stop paying for it.
# main is deliberately EXEMPT: install/release.sh refuses to tag unless the
# tests run for that exact SHA concluded `success`, and a cancelled run is not
# success — cancelling on main would turn every closely-spaced push into a
# blocked release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unittest:
    strategy:
      fail-fast: false
      # PRs run the ubuntu leg only; push (main) and workflow_dispatch run all
      # three OSes. This is a billing decision, not a coverage one: GitHub
      # rounds every job UP to a whole minute and multiplies macOS ×10 and
      # Windows ×2, so the ~50 s macOS leg bills 10 min and a full-matrix PR
      # round-trip (PR run + merge push run) cost ~28 billed minutes for ~5
      # real ones — that alone burned a third of the account's 2,000-min month
      # in Aug 2026. What the trim actually risks: a PR touching the win32
      # branches or macos-swift/ can go green here and only fail on the push
      # run after merge. That is acceptable because the thing this workflow
      # ultimately protects is the RELEASE, and install/release.sh's tag gate
      # reads only push runs on main (`--event push --branch main --commit
      # <sha>`), which still get the full matrix — a cross-OS break caught
      # post-merge blocks the tag exactly as before, it just surfaces one step
      # later. For pre-merge cross-OS confidence, dispatch the workflow on the
      # PR branch by hand (see the `on:` comment above).
      matrix:
        os: ${{ (github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]')) || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # Repo floor is 3.9 (see README.md "Layout" section and
      # smartbar/core/popover_layout.py). We pin one version above that
      # floor rather than a floor-to-ceiling matrix: the suite is plain
      # stdlib unittest with no version-conditional code paths, so testing
      # N Pythons buys nothing but CI minutes.
      #
      # There is deliberately no 3.9 LEG, and it is not an oversight: GitHub's
      # ubuntu-24.04 runners cache 3.10 upward, and the pinned pycairo below
      # is itself 3.10+, so a 3.9 job would be a bespoke interpreter build
      # plus a second pycairo pin to maintain forever. What the floor actually
      # needs protecting from is one specific mistake — `x: str | None`, valid
      # syntax that raises TypeError at import on 3.9 — and ruff's FA102 rule
      # (enabled in pyproject.toml, under `target-version = "py39"`) catches
      # exactly that, statically, on every run. See that file's own comment.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Linux/macOS build pycairo from its sdist and therefore need cairo's
      # headers plus pkg-config. Windows receives PyPI's cp312 win_amd64
      # wheel and needs no system SDK. Keep GTK/PyGObject absent: the portable
      # painter deliberately has no GTK dependency, while importing cairo is
      # mandatory below so painter tests cannot quietly turn into skips.
      - name: Install Cairo build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install Cairo build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pkg-config

      - name: Install pinned pycairo
        run: python -m pip install --disable-pip-version-check pycairo==1.29.0

      - name: Verify Cairo is importable
        run: python -c "import cairo; print(cairo.cairo_version_string())"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # ruff check (not "ruff format --check"): nearly every file in this
      # repo is DELIBERATELY hand-formatted -- aligned "# --- name ---"
      # section markers, hand-wrapped comment blocks that read as prose,
      # continuation lines lined up under the open paren by eye rather than
      # by the formatter's rules. Turning the formatter loose here would be
      # a ~5800-line cosmetic rewrite on every one of those files that
      # destroys structure a reviewer put there on purpose, for a gain
      # (consistent auto-formatting) this repo has explicitly opted out of.
      # `ruff check` catches the things that were never a style choice --
      # unused imports, unused locals, genuine defects -- without touching
      # any of that layout, so it is the one half of "ruff" this job runs.
      #
      # One leg only: unlike the unittest step above, ruff check is pure
      # static analysis over the checked-out source tree -- it never
      # executes any of this repo's OS-conditional code paths (win32
      # branches, gi/GTK on Linux, etc.), so its result cannot vary by
      # runner OS. Running it on all three would just be the same verdict
      # three times for three times the CI minutes. ubuntu-latest is
      # picked as the one leg because it is the cheapest GitHub-hosted
      # runner and needs no extra setup for this step.
      - name: Install ruff
        if: matrix.os == 'ubuntu-latest'
        run: pip install ruff==0.15.16

      - name: Lint (ruff check)
        if: matrix.os == 'ubuntu-latest'
        run: ruff check .

      # Compile the Swift front-end so a macOS-breaking change cannot land
      # green. There is no Swift test target: the state policy Swift mirrors
      # is pinned from the Python side by the source-scraping parity tests.
      - name: Build the Swift front-end
        if: runner.os == 'macOS'
        run: swift build -c release --package-path macos-swift

  # The e2e suites used to run ONLY from install/release.sh, on whichever
  # machine cut the release. That made the tag gate weaker than the release
  # script it gates: CI would go green on a change that broke the installers,
  # and only the maintainer's own laptop would ever find out.
  #
  # ubuntu is the right (and only needed) leg. Both scripts branch on
  # `uname`, and their macOS arms are the ones a release cut on a Mac already
  # covers — so running them here exercises the LINUX arms that otherwise
  # never run anywhere. Both are hermetic by construction: e2e-config shadows
  # launchctl/systemctl/crontab/pkill/setsid/nohup with no-op stubs and points
  # HOME at a temporary directory, and e2e-update builds a throwaway origin
  # and sets SMARTBAR_UPDATE_TARGETS so it can never reach a real install.
  #
  # These two and not the other three: e2e-config writes the units every
  # device re-installs on update (a malformed one is not a degraded feature,
  # it is a device that stops running the app) and e2e-update drives the
  # rollback path that protects devices nobody can test by hand. e2e-warmup,
  # e2e-autoadd and e2e-presence need stateful mocks or a real bare remote,
  # and stay where they are, behind release.sh's --full.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No pycairo: neither script renders anything. They drive the
      # installers and the update state machine, which are cairo-free.
      - name: config.env reaches the real agents
        run: ./tests/e2e-config.sh

      - name: self-update applies, blocks and rolls back
        run: ./tests/e2e-update.sh
